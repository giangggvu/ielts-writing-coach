name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coach"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach
      TEST_DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (PostgreSQL, fake AI provider)
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ielts-writing-coach .
